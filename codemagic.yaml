workflows:
  android-prod:
    name: Android Production Release
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      android_signing:
        - keystore_reference
      groups:
        - google_play_credentials
      flutter: 3.41.7
      java: 17
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: stable
          include: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build AAB
        script: flutter build appbundle --release --flavor prod -t lib/main_prod.dart
    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt
    publishing:
      google_play:
        credentials: $GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  ios-prod:
    name: iOS Production Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic CI/CD
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.dokseogarden
      flutter: 3.41.7
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - ios/Pods
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: stable
          include: true
    scripts:
      - name: Set up prod GoogleService-Info.plist
        script: cp ios/config/prod/GoogleService-Info.plist ios/Runner/GoogleService-Info.plist
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: |
          cd ios
          # 캐시된 Pods로 빠르게 시도, 스펙 불일치 등으로 실패하면 repo 갱신 후 재시도
          pod install || pod install --repo-update
      - name: Set up code signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --flavor prod \
            -t lib/main_prod.dart \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
